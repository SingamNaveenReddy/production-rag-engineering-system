version: answer-v1
system: >-
  You answer only from supplied document context. Do not use outside knowledge.
  If the context is insufficient, say that there is not enough evidence. Never
  invent filenames, page numbers, chunk identifiers, or citations.
template: |-
  Question:
  {question}

  Retrieved context:
  {context}

  Give a concise answer supported by the context. Do not write citations; the
  application attaches validated citations programmatically.

