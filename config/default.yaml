chunking:
  chunk_size: 700
  chunk_overlap: 100
retrieval:
  dense_top_k: 5
  sparse_top_k: 5
  hybrid_candidate_count: 30
  reranker_top_k: 5
  rrf_k: 60
  minimum_score: 0.25
providers:
  qdrant_url: http://localhost:6333
  qdrant_collection: documents
  ollama_base_url: http://localhost:11434
  llm_model: qwen3:4b
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
prompt:
  answer_file: prompts/answer_v2.yaml
logging:
  level: INFO
evaluation:
  dataset_path: evaluation/golden_dataset.jsonl
  retrieval_k: 5
  thresholds:
    retrieval_recall_at_k: 0.85
    faithfulness: 0.85
    citation_accuracy: 0.90
    refusal_accuracy: 0.90
    max_p95_latency_ms:
